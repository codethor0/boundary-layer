name: Staging Readiness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  staging-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Run unit tests
        run: make test

      - name: Run lint
        run: make lint

      - name: Production SaaS mocked readiness
        run: make production-saas-check-example

      - name: Staging mocked readiness
        run: make production-saas-staging-readiness-example

      - name: Managed services mocked readiness
        run: make production-saas-managed-services-example

      - name: Staging deploy dry run
        run: |
          export BOUNDARY_LAYER_PROFILE=production-saas
          export BOUNDARY_LAYER_ENV=staging
          export DATABASE_URL='postgresql://example:example@db.staging.example:5432/boundary_layer?sslmode=require'
          export REDIS_URL='rediss://:example@redis.staging.example:6379/0'
          export SECRET_MANAGER_PROVIDER=aws
          export SECRET_MANAGER_PROJECT_OR_PATH=boundary-layer/staging
          export OBJECT_STORAGE_BUCKET=boundary-layer-staging-artifacts-example
          export BOUNDARY_LAYER_PUBLIC_BASE_URL=https://staging.example.com
          export STAGING_RELEASE_IMAGE=ghcr.io/example/boundary-layer:staging-placeholder
          make staging-deploy-dry-run

      - name: Secret scan
        run: |
          if command -v rg >/dev/null 2>&1; then
            ! rg -n "(BEGIN (RSA )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})" \
              --glob '!.github/**' --glob '!docs/**' .
          fi

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          for path in [
              "detections/prometheus/alerts.yml",
              "detections/prometheus/prometheus.yml",
              "detections/alertmanager/alertmanager.yml",
              ".github/workflows/staging-readiness.yml",
              ".github/workflows/staging-deploy.yml",
          ]:
              with open(path, "r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"YAML OK: {path}")
          PY
