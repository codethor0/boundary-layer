name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Attempt staging deploy (requires DEPLOY_STAGING=true in environment)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  staging-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Unit tests and lint
        run: |
          make test
          make lint

      - name: Container build and local smoke
        run: |
          make container-build
          make container-smoke-local

      - name: Structural staging checks
        run: |
          make production-saas-staging-readiness-example
          make production-saas-managed-services-example
          make staging-smoke-structural

      - name: Dry run deploy gate
        if: ${{ inputs.deploy_staging != 'true' && vars.DEPLOY_STAGING != 'true' }}
        run: |
          echo "DRY RUN ONLY"
          bash scripts/deploy-staging-aws.sh

      - name: Staging deploy attempt
        if: ${{ inputs.deploy_staging == 'true' || vars.DEPLOY_STAGING == 'true' }}
        env:
          DEPLOY_STAGING: "true"
          CONFIRM_STAGING_DEPLOY: "true"
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          STAGING_RELEASE_IMAGE: ${{ secrets.STAGING_RELEASE_IMAGE }}
          BOUNDARY_LAYER_PUBLIC_BASE_URL: ${{ secrets.BOUNDARY_LAYER_PUBLIC_BASE_URL }}
          PUSH_IMAGE: "true"
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          make container-build
          bash scripts/deploy-staging-aws.sh

      - name: Live staging smoke after deploy
        if: ${{ (inputs.deploy_staging == 'true' || vars.DEPLOY_STAGING == 'true') && secrets.STAGING_BASE_URL != '' }}
        env:
          RUN_LIVE_STAGING_CHECKS: "true"
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TEST_ACCESS_TOKEN_TENANT_A: ${{ secrets.STAGING_TEST_ACCESS_TOKEN_TENANT_A }}
          STAGING_TEST_ACCESS_TOKEN_TENANT_B: ${{ secrets.STAGING_TEST_ACCESS_TOKEN_TENANT_B }}
          STAGING_METRICS_AUTH_TOKEN: ${{ secrets.STAGING_METRICS_AUTH_TOKEN }}
        run: make staging-smoke-live
